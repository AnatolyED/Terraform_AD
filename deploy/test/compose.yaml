name: terraform-ad-debian12-adm

services:
  gitlab:
    profiles: [terraform]
    image: terraform-ad-lab/gitlab:19.5.1
    pull_policy: never
    hostname: ${ADM_GITLAB_HOST}
    shm_size: 256m
    ports:
      - "${ADM_GITLAB_BIND_IP:-127.0.0.1}:${ADM_GITLAB_PORT}:${ADM_GITLAB_PORT}"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://${ADM_GITLAB_HOST}:${ADM_GITLAB_PORT}'
        letsencrypt['enable'] = false
        nginx['ssl_certificate'] = '/test-tls/gitlab.pem'
        nginx['ssl_certificate_key'] = '/test-tls/gitlab.key'
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 5
        prometheus_monitoring['enable'] = false
        gitlab_kas['enable'] = false
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-data:/var/opt/gitlab
      - gitlab-logs:/var/log/gitlab
      - "${ADM_RUNTIME}/tls/gitlab.pem:/test-tls/gitlab.pem:ro"
      - "${ADM_RUNTIME}/tls/gitlab.key:/test-tls/gitlab.key:ro"
    networks:
      default:
        aliases: ["${ADM_GITLAB_HOST}"]

  vault:
    profiles: [vault]
    image: terraform-ad-lab/vault:2.2.1
    pull_policy: never
    cap_add: [IPC_LOCK]
    ports:
      - "${ADM_VAULT_BIND_IP:-127.0.0.1}:${ADM_VAULT_PORT}:8200"
    extra_hosts:
      - "${ADM_AD_HOST}:${ADM_AD_IP}"
    command: [server, -config=/test-tls/vault.hcl]
    volumes:
      - vault-data:/vault/file
      - "${ADM_RUNTIME}/tls/vault.pem:/test-tls/vault.pem:ro"
      - "${ADM_RUNTIME}/tls/vault.key:/test-tls/vault.key:ro"
      - "${ADM_RUNTIME}/tls/vault.hcl:/test-tls/vault.hcl:ro"
    networks:
      default:
        aliases: ["${ADM_VAULT_HOST}"]

networks:
  default:
    name: terraform-ad-debian12-adm

volumes:
  gitlab-config:
  gitlab-data:
  gitlab-logs:
  vault-data:
