vault-01:
  address: https://vault.terraform.test:8200
  ad_environment: lab
  auth_bind_password_version: 1
  secrets_bind_password_version: 1
  policies:
    lab-app-read:
      ad-creds/static-cred/lab-app: [read]
  group_policies:
    vault-readers: [lab-app-read]
  static_roles:
    lab-app:
      user_id: lab-app
      rotation_period_seconds: 60
