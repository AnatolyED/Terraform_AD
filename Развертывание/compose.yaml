name: terraform-ad-lab

x-vault: &vault
  image: terraform-ad-lab/vault:2.2.1
  pull_policy: never
  cap_add: [IPC_LOCK]
  extra_hosts:
    - "${LAB_AD_HOST}:${LAB_AD_IP}"
  volumes:
    - "${LAB_RUNTIME}/tls/gitlab-ca.pem:/gitlab-ca.pem:ro"

services:
  gitlab:
    image: terraform-ad-lab/gitlab:19.5.1
    pull_policy: never
    hostname: gitlab.terraform.test
    shm_size: 256m
    ports:
      - "127.0.0.1:${LAB_GITLAB_PORT}:${LAB_GITLAB_PORT}"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.terraform.test:${LAB_GITLAB_PORT}'
        letsencrypt['enable'] = false
        nginx['ssl_certificate'] = '/lab-tls/gitlab.pem'
        nginx['ssl_certificate_key'] = '/lab-tls/gitlab.key'
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 5
        prometheus_monitoring['enable'] = false
        gitlab_kas['enable'] = false
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-data:/var/opt/gitlab
      - gitlab-logs:/var/log/gitlab
      - "${LAB_RUNTIME}/tls:/lab-tls:ro"
    networks:
      default:
        aliases: [gitlab.terraform.test]

  runner:
    image: terraform-ad-lab/runner:19.5.1
    pull_policy: never
    volumes:
      - runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
      - "${LAB_RUNTIME}/tls/gitlab-ca.pem:/lab-ca.pem:ro"

  vault-01:
    <<: *vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_ROOT_01}"
      VAULT_ADDR: https://vault-01:8200
      VAULT_CACERT: /tmp/vault-ca.pem
    command: [server, -dev, -dev-tls, -dev-tls-san=vault-01, -dev-tls-cert-dir=/tmp, -dev-listen-address=0.0.0.0:8200]
  vault-02:
    <<: *vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_ROOT_02}"
      VAULT_ADDR: https://vault-02:8200
      VAULT_CACERT: /tmp/vault-ca.pem
    command: [server, -dev, -dev-tls, -dev-tls-san=vault-02, -dev-tls-cert-dir=/tmp, -dev-listen-address=0.0.0.0:8200]
  vault-03:
    <<: *vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_ROOT_03}"
      VAULT_ADDR: https://vault-03:8200
      VAULT_CACERT: /tmp/vault-ca.pem
    command: [server, -dev, -dev-tls, -dev-tls-san=vault-03, -dev-tls-cert-dir=/tmp, -dev-listen-address=0.0.0.0:8200]
  vault-04:
    <<: *vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_ROOT_04}"
      VAULT_ADDR: https://vault-04:8200
      VAULT_CACERT: /tmp/vault-ca.pem
    command: [server, -dev, -dev-tls, -dev-tls-san=vault-04, -dev-tls-cert-dir=/tmp, -dev-listen-address=0.0.0.0:8200]
  vault-05:
    <<: *vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_ROOT_05}"
      VAULT_ADDR: https://vault-05:8200
      VAULT_CACERT: /tmp/vault-ca.pem
    command: [server, -dev, -dev-tls, -dev-tls-san=vault-05, -dev-tls-cert-dir=/tmp, -dev-listen-address=0.0.0.0:8200]

networks:
  default:
    name: terraform-ad-lab-network

volumes:
  gitlab-config:
  gitlab-data:
  gitlab-logs:
  runner-config:
